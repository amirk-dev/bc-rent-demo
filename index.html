<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1A6E">
<meta name="description" content="Демонстрация системы управления коммерческой арендой бизнес-центра. Данные вымышленные.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Управление арендой бизнес-центра, демонстрация</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<!-- Значки разделов. Инлайновый спрайт, потому что внешних файлов и шрифтов
     у страницы быть не должно, а эмодзи выглядят по-разному на разных телефонах. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-grid" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/>
      <rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/>
    </g>
    <g id="i-user" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2c.9-3.6 3.8-5.4 7.2-5.4s6.3 1.8 7.2 5.4"/>
    </g>
    <g id="i-bill" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2.8h12v18.4l-3-1.8-3 1.8-3-1.8-3 1.8z"/><path d="M9.4 8.2h5.2M9.4 12.4h5.2"/>
    </g>
    <g id="i-chat" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.5 12.4c0 4-3.8 7.2-8.5 7.2-1.1 0-2.2-.2-3.2-.5L4 20.8l1.5-3.6C4.1 15.9 3.5 14.2 3.5 12.4c0-4 3.8-7.2 8.5-7.2s8.5 3.2 8.5 7.2z"/>
    </g>
    <g id="i-cal" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.2" y="5" width="17.6" height="16" rx="2"/><path d="M3.2 10h17.6M8 3v4M16 3v4"/>
    </g>
    <g id="i-ai" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l1.9 4.9L18.8 9.8l-4.9 1.9L12 16.6l-1.9-4.9L5.2 9.8l4.9-1.9z"/>
      <path d="M17.8 16l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z"/>
    </g>
    <g id="i-shop" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.6 9.2 5.2 4h13.6l1.6 5.2"/><path d="M4.6 9.2h14.8v11.2H4.6z"/>
      <path d="M3.6 9.2c0 1.6 1.2 2.6 2.6 2.6s2.6-1 2.6-2.6c0 1.6 1.2 2.6 2.6 2.6s2.6-1 2.6-2.6c0 1.6 1.2 2.6 2.6 2.6s2.6-1 2.6-2.6"/>
      <path d="M10 20.4v-5h4v5"/>
    </g>
    <g id="i-chart" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20.2h16"/><path d="M7 17V11M12 17V5.4M17 17v-8.4"/>
    </g>
    <g id="i-list" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.4 6.6h15.2M4.4 12h15.2M4.4 17.4h15.2"/>
    </g>
    <g id="i-more" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M5 12h.01M12 12h.01M19 12h.01"/>
    </g>
  </defs>
</svg>

<header class="top">
  <div class="brand"><i></i><div>Аренда<small>управление объектом</small></div></div>
  <div class="obj">
    <b id="objName">Бизнес-центр</b>
    <span id="objSub">объект</span>
  </div>
  <div class="right">
    <span class="src">данные: <b>демонстрационные</b></span>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Разделы"></nav>
  <div class="main">
    <div class="bar" id="bar"></div>
    <div class="stage">
      <div class="scroll" id="view"></div>
      <aside class="panel blank" id="panel" hidden></aside>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Остальные разделы"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
/* Работа без сети нужна только у выложенной по ссылке версии. По протоколу
   file:// служебные работники запрещены, поэтому регистрация под двойным
   кликом не выполняется вовсе, а не падает с ошибкой в консоль. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* показу не мешает */ });
  });
}
</script>
</body>
</html>
